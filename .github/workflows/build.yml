name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      # 和 build.bat 完全一致：用 Windows 自带的 csc.exe，
      # 不需要 .NET SDK、不需要 NuGet、不联网还原依赖。
      - name: 编译
        shell: cmd
        run: |
          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if not exist "%CSC%" set "CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if not exist "%CSC%" (
            echo [X] csc.exe not found - needs .NET Framework 4.x
            exit /b 1
          )
          "%CSC%" /nologo /codepage:65001 /target:winexe /optimize+ /out:L4D2Setup.exe /win32icon:app.ico ^
            /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll ^
            /reference:System.Windows.Forms.dll /reference:System.IO.Compression.dll ^
            /reference:System.IO.Compression.FileSystem.dll ^
            /resource:desk\index.html,desk.html ^
            /resource:desk\three.min.js,three.js ^
            AssemblyInfo.cs Theme.cs Glyph.cs Program.cs Core.cs Launch.cs Dup.cs Catalog.cs Parts.cs ^
            CatPrefs.cs MyBranch.cs Tweaks.cs Work.cs Mods.cs Identify.cs SelfTest.cs CatTree.cs TreeHost.cs Desk.cs DeskServer.cs OverviewModel.cs OverviewLayout.cs OverviewCanvas.cs Ui.cs SettingsForm.cs Dpi.cs Workshop.cs
          if errorlevel 1 exit /b 1
          dir L4D2Setup.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: L4D2Setup
          path: L4D2Setup.exe
          if-no-files-found: error

      # 只编过不等于跑得起来：布局自检要真的把 MainForm 建出来走一遍排版，
      # 能抓到「按钮叠了 / 栏跑出窗口 / 新代码在构造期抛异常」这类编译期看不见的问题。
      # 它不开窗口、不读 MOD 库、不需要游戏目录，几秒就完。
      # 注意用 PowerShell：cmd 批处理不会等 GUI 程序退出，%errorlevel% 会失真。
      # 先设成不阻塞（continue-on-error），观察一两轮绿了再把那行删掉转成硬门禁。
      - name: 布局自检
        continue-on-error: true
        shell: powershell
        run: |
          & .\L4D2Setup.exe --layoutself
          $code = $LASTEXITCODE
          Write-Host "layoutself exit=$code"
          if ($code -ne 0) { exit $code }

      # 工坊解析是纯离线的（链接解析 / 文件名清理 / JSON 提取），一并跑一遍
      - name: 工坊离线自检
        continue-on-error: true
        shell: powershell
        run: |
          & .\L4D2Setup.exe --workshopself
          $code = $LASTEXITCODE
          Write-Host "workshopself exit=$code"
          if ($code -ne 0) { exit $code }

      - name: 把自检日志一起带走
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: _装机记录/
          if-no-files-found: ignore

      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" L4D2Setup.exe \
            --title "${GITHUB_REF_NAME}" \
            --notes "由 GitHub Actions 自动编译，与源码同一提交；校验哈希见下方附件信息。"
